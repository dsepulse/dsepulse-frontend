<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Data Sync Audit &middot; DSE Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#FAF8F3;--cream2:#F4F0E6;--navy:#0D1F3C;--gold:#B8860B;
  --gold-bg:#FDF8EC;--gold-border:#E8D5A0;--green:#1A6B3C;--green-bg:#EDF7F1;--green-border:#A7D7C0;
  --red:#B91C1C;--red-bg:#FEF2F2;--red-border:#FECACA;
  --text:#1A1A2E;--text2:#4A5568;--text3:#9AA3B0;--border:#E2DECE;--border2:#D1C9B8;
  --mono:'JetBrains Mono',monospace;--serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream2);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hdr{background:var(--white);border-bottom:1px solid var(--border);padding:16px 22px}
.hdr-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-weight:800;font-size:20px;color:var(--navy)}.logo span{color:var(--gold)}
.back{font-size:12px;color:var(--gold);text-decoration:none;font-weight:600}.back:hover{text-decoration:underline}
.wrap{max-width:900px;margin:0 auto;padding:22px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.h-title{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--navy);margin-bottom:2px}
.h-sub{font-size:12px;color:var(--text3)}
.badge{font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px}
.refresh{padding:7px 14px;border:1px solid var(--border2);border-radius:7px;background:var(--white);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.refresh:hover{background:var(--cream);border-color:var(--navy)}
.section-lbl{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);margin:18px 0 6px}
.card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-title{font-size:13px;font-weight:700;color:var(--navy)}
.card-sub{font-size:11px;color:var(--text3)}
.pill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:12px;margin-left:auto}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.fail{background:var(--red-bg);color:var(--red)}
.pill.warn{background:var(--gold-bg);color:var(--gold)}
.trow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--cream2);font-size:12px}
.trow .l{color:var(--text2)}.trow .r{font-weight:600;font-family:var(--mono);font-size:11px}
/*  Fixed columns came to 465px, so on a 360px phone the last two ran off the
    side of the screen and took the whole page sideways with them. Flexible
    columns with a floor instead: 70 + 4x52 = 278px, which fits the narrowest
    phone still in service. */
.ptbl{display:grid;grid-template-columns:minmax(70px,1.4fr) repeat(4,minmax(52px,1fr));
  gap:4px;font-size:11px}
@media (max-width:480px){ .ptbl{font-size:10px;gap:3px} }
.ptbl .th{font-size:9px;font-weight:700;color:var(--text3);text-align:right;padding:2px 0}
.ptbl .th:first-child{text-align:left}
.ptbl .td{text-align:right;padding:4px 0;border-top:1px solid var(--cream2);font-family:var(--mono)}
.ptbl .td:first-child{text-align:left;font-weight:700;color:var(--navy)}
.ptbl .td.ok{color:var(--green)}.ptbl .td.warn{color:var(--gold)}.ptbl .td.muted{color:var(--text3)}
.alert{font-size:11px;padding:7px 11px;border-radius:7px;margin-bottom:5px;line-height:1.5}
.alert.red{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.alert.amber{background:var(--gold-bg);border:1px solid var(--gold-border);color:#7a5500}
.alert.green{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.dot-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px}
.dot-sq{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dot-lbl{font-size:9px;color:var(--text3)}
.foot{text-align:center;font-size:11px;color:var(--text3);padding:22px;margin-top:6px}
/*  This page is now behind the admin key. It was unlinked, which is not the
    same as private: it called six PAID endpoints with no token, so anyone who
    knew the URL read subscriber-only output for free. */
.gate{max-width:340px;margin:70px auto;text-align:center;padding:0 18px}
.gate h2{font-family:var(--serif);font-size:20px;color:var(--navy);margin-bottom:6px}
.gate p{font-size:12px;color:var(--text3);line-height:1.6;margin-bottom:16px}
.gate input{width:100%;padding:11px 13px;border:1px solid var(--border2);
  border-radius:8px;font:400 13px/1 inherit;background:var(--white);color:var(--text)}
.gate button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:8px;
  background:var(--navy);color:#fff;font:600 13px/1 inherit;cursor:pointer}
.gate .err{font-size:11.5px;color:var(--red);margin-top:10px;min-height:16px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in">
  <div class="logo"><span>&#9670;</span> DSE Pulse</div>
  <a class="back" href="https://dsepulse.com">&larr; Back to app</a>
</div></div>
<div class="gate" id="gate">
  <h2>Data sync audit</h2>
  <p>Internal. Enter your admin key to run the check.</p>
  <input id="keyIn" type="password" placeholder="Admin key" autocomplete="off"
         onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">Run the audit</button>
  <div class="err" id="gateMsg"></div>
</div>

<div class="wrap hide" id="app">
  <div class="top">
    <div>
      <div class="h-title">Data sync audit</div>
      <div class="h-sub" id="run-time">Checking all tools&hellip;</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="badge" id="sync-badge"></span>
      <button class="refresh" onclick="run()">&#8635; Refresh</button>
      <button class="refresh" onclick="lock()">Lock</button>
    </div>
  </div>
  <div id="alerts"></div>
  <div id="out"></div>
  <div class="foot">Admin audit &middot; DSE Pulse &middot; not for users</div>
</div>
<script src="/env.js"></script>
<script src="/auth.js"></script>
<script>
const API=(window.DSEEnv?window.DSEEnv.apiBase:"https://dsepulse-backend-production.up.railway.app");

/*  ONE call, with the admin key, to an endpoint that returns a VERDICT.

    What this replaces: eight anonymous calls — picks, wma, tech, combined, bd,
    activity, track-record, freshness — six of them plan-gated, all of them
    unauthenticated, with the comparing done here in the browser. Three
    problems with that, and only the first is about security:

      · the page handed subscriber-only output to anyone with the URL;
      · when PLAN_GATE_MODE goes to enforce, six of the eight return 403 and
        this page reports the whole pipeline as dead;
      · "is the data in sync" was decided in a browser, where it can be edited.

    The endpoint reads the same tables and returns counts, dates and deltas.
    It never returns a signal, a score or a level.  */
let KEY = sessionStorage.getItem("dse_admin_key") || "";
const H = () => ({ "X-Admin-Key": KEY });

const fmtD=s=>{if(!s)return'—';try{return new Date(String(s).slice(0,10)+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return s;}};
const ago=n=>n==null?'no data':n===0?'today':n===1?'yesterday':n+'d ago';
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function show(app){
  document.getElementById('gate').classList.toggle('hide', !!app);
  document.getElementById('app').classList.toggle('hide', !app);
}
async function unlock(){
  KEY=document.getElementById('keyIn').value.trim();
  const m=document.getElementById('gateMsg');
  if(!KEY){m.textContent='Enter a key.';return;}
  m.textContent='Checking…';
  try{
    const r=await fetch(API+'/api/admin/audit',{headers:H()});
    if(r.status===401||r.status===403){m.textContent='Wrong admin key.';return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    sessionStorage.setItem('dse_admin_key',KEY);
    show(true); render(await r.json());
  }catch(e){ m.textContent='Could not reach the backend: '+e.message; }
}
function lock(){ sessionStorage.removeItem('dse_admin_key'); location.reload(); }

function sec(t){return `<div class="section-lbl">${t}</div>`;}
function card(h,body){return `<div class="card"><div class="card-hdr">${h}</div>${body}</div>`;}
function hdr(t,sub,state){
  const cls=state==='ok'?'ok':state==='warn'?'warn':'fail';
  const lbl=state==='ok'?'In sync':state==='warn'?'Warning':'Out of sync';
  return `<span class="card-title">${t}</span><span class="card-sub">${sub}</span><span class="pill ${cls}">${lbl}</span>`;
}
function trow(l,r,col){return `<div class="trow"><span class="l">${l}</span><span class="r" style="color:${col||'var(--text)'}">${r}</span></div>`;}
const CMDS=[];
function alertBox(msg,type,cmd){
  const id='cmd_'+Math.random().toString(36).slice(2,7);
  const btnHtml=cmd
    ? `<div style="margin-top:6px;display:flex;align-items:center;gap:8px">
        <code style="font-size:10px;font-family:var(--mono);background:rgba(0,0,0,.06);padding:3px 7px;border-radius:4px;flex:1;overflow-x:auto;white-space:nowrap">${cmd}</code>
        <button onclick="copyCmd('${id}','${cmd.replace(/'/g,"\'")}')" id="${id}" style="font-size:10px;padding:3px 10px;border:1px solid currentColor;border-radius:4px;background:transparent;cursor:pointer;color:inherit;font-family:inherit;white-space:nowrap">Copy</button>
       </div>`
    : `<div style="margin-top:4px;font-size:10px;opacity:.8">Resolves automatically on next daily run ✓</div>`;
  if(cmd&&!CMDS.includes(cmd))CMDS.push(cmd);
  return `<div class="alert ${type}">${msg}${btnHtml}</div>`;
}
function copyCmd(id,cmd){
  navigator.clipboard.writeText(cmd).then(()=>{
    const b=document.getElementById(id);if(b){b.textContent='Copied ✓';setTimeout(()=>{b.textContent='Copy';},2000);}
  }).catch(()=>{
    const b=document.getElementById(id);if(b){b.textContent='Failed';setTimeout(()=>{b.textContent='Copy';},2000);}
  });
}

async function run(){
  const out=document.getElementById('out');
  out.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">Checking all tools&hellip;</div>';
  try{
    const r=await fetch(API+'/api/admin/audit',{headers:H()});
    if(r.status===401||r.status===403){ show(false); return; }
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    out.innerHTML='<div class="alert red">Could not run the audit: '+
      String(e.message||e).replace(/</g,'&lt;')+'</div>';
  }
}

function render(d){
  const c=d.checks, out=document.getElementById('out');
  const alEl=document.getElementById('alerts'), badge=document.getElementById('sync-badge');
  let html='';

  // 1 · trade date alignment
  html+=sec('1. Trade date alignment — all tools must show same date');
  html+=card(hdr('Date sync','every tool should upload on the same day',c.dates.state),
    c.dates.tools.map(t=>trow(t.label, t.date?fmtD(t.date)+' &middot; '+ago(t.days_ago):'—',
      !t.date?'var(--text3)':t.date===c.dates.latest&&t.days_ago<=1?'var(--green)':
      t.date===c.dates.latest?'var(--gold)':'var(--red)')).join('')+
    trow('Latest date across tools',fmtD(c.dates.latest),
      c.dates.state==='ok'?'var(--green)':'var(--red)'));

  // 2 · universe
  const n=c.universe.counts;
  html+=sec('2. Stock universe — tools should cover similar number of stocks');
  html+=card(hdr('Universe coverage','stock count across all tools',c.universe.state),
    trow("Today's picks",n.picks+' stocks')+
    trow('WMA signals',n.wma+' signals today')+
    trow('Tech analysis',n.tech+' stocks')+
    trow('Combined signal',n.combined+' stocks qualifying today')+
    trow('BD signal',n.bd+' stocks')+
    trow('Smart money',n.activity+' signals'));

  // 3 · price consistency
  const money=v=>v?'৳'+Number(v).toFixed(2):'—';
  let rows='';
  c.prices.rows.forEach(p=>{
    rows+='<span class="td'+(p.ok?'':' warn')+'">'+esc(p.code)+'</span>'+
      '<span class="td'+(p.tech?'':' muted')+'">'+money(p.tech)+'</span>'+
      '<span class="td'+(p.wma?'':' muted')+'">'+money(p.wma)+'</span>'+
      '<span class="td'+(p.combined?'':' muted')+'">'+money(p.combined)+'</span>'+
      '<span class="td '+(p.ok?'ok':'warn')+'">'+(p.ok?'✓':'Δ'+p.delta.toFixed(2))+'</span>';
  });
  html+=sec('3. LTP price consistency — same stock must show same price in every tool');
  html+=card(hdr('Price sync','LTP comparison across Tech, WMA and Combined',c.prices.state),
    '<div class="ptbl"><span class="th">Code</span><span class="th">Tech</span>'+
    '<span class="th">WMA</span><span class="th">Combined</span><span class="th">Match</span>'+
    rows+'</div>'+
    (c.prices.mismatches?'<div style="margin-top:8px;font-size:11px;color:var(--gold)">⚠ '+
      c.prices.mismatches+' above ৳2 apart. Prices refresh from the tech run.</div>':''));

  // 4 · combined ran with the others
  const cb=c.combined;
  let cbBody;
  if(cb.state==='ok'){
    cbBody='<div style="font-size:11px;color:var(--green);padding:4px 0">Combined, Tech and WMA all on '+
      fmtD(cb.combined_date)+' — the engines ran together ✓</div>'+
      '<div style="font-size:11px;color:var(--text3);padding:4px 0;border-top:1px solid var(--cream2)">'+
      'Individual stocks may differ between engines. Each uses an independent formula; that is expected.</div>';
  } else if(!cb.count){
    cbBody='<div style="font-size:11px;color:var(--text3);padding:4px 0">No combined stocks today — '+
      'the strict criteria were not met. Normal on a quiet or bearish day.</div>';
  } else {
    cbBody='<div style="font-size:11px;color:var(--gold);padding:4px 0">Combined is on '+
      fmtD(cb.combined_date)+' but Tech is on '+fmtD(cb.tech_date)+
      ' — run DSE_MANUAL.bat to sync every tool to the same date.</div>';
  }
  html+=sec('4. Combined signal integrity — did it run with Tech and WMA');
  html+=card(hdr('Combined integrity','same run, same date',cb.state),cbBody);

  // 5 · the 52-week table
  html+=sec('5. 52-week high/low table — must update with every dse_tech.py run');
  html+=card(hdr('52-wk sync','stock_52w Supabase table',c.stock52.state),
    trow('Last updated',c.stock52.updated?fmtD(c.stock52.updated)+' &middot; '+ago(c.stock52.days_ago):'—',
      c.stock52.state==='ok'?'var(--green)':'var(--gold)'));

  // 6 · seven days of runs
  let dots='';
  c.history.days.forEach(day=>{
    let bg,lbl,col;
    if(day.ran){bg='var(--green)';lbl='✓';col='#fff';}
    else if(day.today){bg='var(--gold)';lbl='?';col='#fff';}
    else if(day.trading){bg='var(--red)';lbl='✗';col='#fff';}
    else{bg='var(--cream2)';lbl='–';col='var(--text3)';}
    dots+='<div class="dot"><div class="dot-sq" style="background:'+bg+';color:'+col+'">'+
      lbl+'</div><div class="dot-lbl">'+DAY[day.dow]+'</div></div>';
  });
  html+=sec('6. 7-day upload history — tech_signals table');
  html+=card(hdr('Daily run history','the DSE trades Sunday to Thursday',c.history.state),
    '<div class="dot-row">'+dots+'</div>'+
    '<div style="font-size:10px;color:var(--text3);margin-top:8px">Green = uploaded '+
    '&middot; Red = trading day missed &middot; Gold = today, pending &middot; '+
    'Grey = Friday, Saturday or a public holiday</div>');

  // 7 · track record
  html+=sec('7. Track record currency');
  html+=card(hdr('Track record','reflects latest resolved picks',c.track.state),
    trow('Last updated',fmtD(c.track.updated),c.track.state==='ok'?'var(--green)':'var(--gold)')+
    trow('Tools tracked',c.track.tools)+
    trow('Total resolved picks',c.track.resolved));

  // the verdict, and what to do about it
  const good=d.issues===0;
  badge.textContent=good?d.passed+'/'+d.total+' All synced ✓':d.passed+'/'+d.total+' checks passed';
  badge.style.cssText='background:'+(good?'var(--green-bg)':d.issues>2?'var(--red-bg)':'var(--gold-bg)')+
    ';color:'+(good?'var(--green)':d.issues>2?'var(--red)':'var(--gold)');
  alEl.innerHTML = good
    ? alertBox('All '+d.total+' checks passed — every tool is in sync with the same data.','green')
    : d.alerts.map(a=>alertBox(esc(a.message),a.level,a.command||null)).join('');

  document.getElementById('run-time').textContent =
    'Checked ' + new Date(d.generated_at).toLocaleTimeString('en-GB',
      {hour:'2-digit',minute:'2-digit'}) + (d.env?' · '+d.env:'');
  out.innerHTML=html;
}

function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

//  A key already in this tab means straight in; anything else shows the gate.
if(KEY){
  fetch(API+'/api/admin/audit',{headers:H()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{show(true);render(d);})
    .catch(()=>{sessionStorage.removeItem('dse_admin_key');show(false);});
}else{ show(false); }
</script>
</body>
</html>
