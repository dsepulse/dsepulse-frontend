<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tech Analysis &middot; DSE Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF; --cream:#FAF8F3; --cream2:#F4F0E6; --cream3:#EDE8DA;
  --navy:#0D1F3C; --navy2:#1A3260; --gold:#B8860B; --gold2:#D4A017;
  --gold-bg:#FDF8EC; --gold-border:#E8D5A0; --green:#1A6B3C; --green-bg:#EDF7F1;
  --red:#B91C1C; --red-bg:#FEF2F2;
  --text:#1A1A2E; --text2:#4A5568; --text3:#9AA3B0; --border:#E2DECE; --border2:#D1C9B8;
  --mono:'JetBrains Mono',monospace; --serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream2);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hdr{background:var(--white);border-bottom:1px solid var(--border);padding:16px 22px}
.hdr-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-weight:800;font-size:20px;color:var(--navy)}
.logo span{color:var(--gold)}
.back{font-size:12px;color:var(--gold);text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.wrap{max-width:960px;margin:0 auto;padding:22px}
.h-title{font-family:var(--serif);font-weight:800;font-size:24px;color:var(--navy);margin-bottom:3px}
.h-sub{font-size:12px;color:var(--text3);margin-bottom:20px}
.tbl{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:78vh;max-width:920px}
.thead{position:sticky;top:0;z-index:2;padding:9px 18px;background:var(--cream2);border-bottom:1px solid var(--border);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3)}
.empty{padding:34px;text-align:center;color:var(--text3);font-size:12px}
.foot{font-size:11px;color:var(--text3);text-align:center;padding:22px;margin-top:8px}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in">
  <div class="logo"><span>&#9670;</span> DSE Pulse</div>
  <a class="back" href="https://dsepulse.com">&larr; Back to app</a>
</div></div>
<div class="wrap">
  <div class="h-title">Tech Analysis</div>
  <div class="h-sub">Technical score &middot; /100</div>
  <div class="tbl">
    
    <div id="tech-rows"><div class="empty">Loading tech signals&hellip;</div></div>
  </div>
  <div class="foot">Informational only &middot; not investment advice &middot; DSE Pulse</div>
</div>
<script>
const API="https://dsepulse-backend-production.up.railway.app";
const sigBg={"STRONG BUY":"var(--green-bg)","BUY":"#F0FDF4","NEUTRAL":"var(--gold-bg)","SELL":"var(--red-bg)"};
const sigTxt={"STRONG BUY":"var(--green)","BUY":"var(--green)","NEUTRAL":"var(--gold)","SELL":"var(--red)"};
const scC=s=>s>=70?'var(--green)':s>=55?'var(--gold)':'var(--red)';
async function fetchJSON(path){ try{ const r=await fetch(API+path); if(!r.ok)return null; return await r.json(); }catch(e){ return null; } }
async function buildTech(){
  const el=document.getElementById('tech-rows');if(!el)return;
  const live=await fetchJSON('/api/tech/today');
  if(!Array.isArray(live)||!live.length){ el.innerHTML=await quietBanner('Technical engine ran — no stock scored above the threshold today','tech signals'); return; }

  /* tech already has today's live prices (dse_tech.py fetches live stock data).
     No override needed -- but we keep the same colour pattern as WMA/Combined
     so prices that moved since the signal run show in green/red. */
  const rows=live.slice(0,60);
  /* compact 4-col: code+signal+rsi, LTP, score */
  const hdrTech='<div style="padding:6px 16px;background:var(--cream2);border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 70px 52px;gap:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)"><span>Stock · signal · RSI</span><span style="text-align:right">LTP</span><span style="text-align:right">Score</span></div>';
  el.innerHTML='<div style="background:var(--white);border:1px solid var(--border);border-radius:9px;overflow:hidden;max-width:920px">'+hdrTech+
    rows.map((r,i)=>{
      const sc=Number(r.score||0),rsi=Number(r.rsi||0),ltp=Number(r.ltp||0),sig=r.signal||'';
      const sccol=sc>=80?'var(--green)':sc>=65?'#2D6A4F':sc>=50?'var(--gold)':'var(--text2)';
      const rsiZone=rsi>65?'overbought':rsi<35?'oversold':'neutral';
      const rsiCol=rsi>65?'var(--red)':rsi<35?'var(--green)':'var(--text3)';
      const sigEl=sig==='STRONG BUY'
        ?`<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--green-bg);color:var(--green)">Strong buy</span>`
        :sig==='BUY'
        ?`<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:#EAF4EF;color:#2D6A4F">Buy</span>`
        :`<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--gold-bg);color:var(--gold)">${sig}</span>`;
      return `<div style="padding:8px 16px;border-bottom:${i===rows.length-1?'none':'1px solid var(--border)'};display:grid;grid-template-columns:1fr 70px 52px;gap:8px;align-items:center">
        <div>
          <span style="font-size:13px;font-weight:700;font-family:var(--mono);color:var(--navy)">${r.code}</span>
          <span style="font-size:9px;padding:1px 4px;background:var(--cream2);border-radius:3px;color:var(--text3);margin-left:4px">${r.cat}</span>
          <div style="display:flex;align-items:center;gap:6px;margin-top:2px">${sigEl}<span style="font-size:9px;font-family:var(--mono);color:${rsiCol}">RSI ${rsi.toFixed(0)} · ${rsiZone}</span><a href="/calculator.html?code=${encodeURIComponent(r.code)}" style="font-size:9px;font-weight:700;color:var(--gold);text-decoration:none">Calc →</a></div>
        </div>
        <div style="text-align:right;font-size:13px;font-weight:700;font-family:var(--mono);color:var(--navy)">৳${ltp.toFixed(2)}</div>
        <div style="text-align:right;font-size:18px;font-weight:700;font-family:var(--mono);color:${sccol}">${sc.toFixed(0)}</div>
      </div>`;
    }).join('')+'</div>';
}
buildTech();
</script>
</body>
</html>
